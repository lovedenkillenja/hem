<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lflix">
<meta name="theme-color" content="#0b0b0f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lflix</title>
<link rel="stylesheet" href="mobil.css">
<script>
  // Inställningar kommer med i länken (#t=kanal&c=trakt-id) och sparas i telefonen.
  (function () {
    var h = location.hash.replace(/^#/, ""), p = {};
    h.split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) p[a[0]] = decodeURIComponent(a[1] || ""); });
    try {
      if (p.t) localStorage.setItem("hem.remoteTopic", p.t);
      if (p.c || p.r) {
        var s = JSON.parse(localStorage.getItem("hem.settings.v1") || "{}");
        if (p.c) s.traktClientId = p.c;
        if (p.r) s.realDebridKey = p.r;   // sparas bara i telefonen, finns aldrig i filerna på GitHub
        localStorage.setItem("hem.settings.v1", JSON.stringify(s));
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header id="top">
  <div class="brand"><span class="bl">L</span>flix</div>
  <div class="tabs">
    <button data-tab="browse" class="on">Bläddra</button>
    <button data-tab="remote">Fjärr</button>
  </div>
  <button id="btn-settings" class="icon" aria-label="Inställningar">⚙</button>
</header>

<div id="now" class="hidden">
  <div class="now-info"><div id="now-title"></div><div id="now-sub"></div></div>
  <div class="now-btns">
    <button data-key="rew" aria-label="Bakåt 10 s">↺10</button>
    <button data-key="toggle" id="now-toggle" aria-label="Paus">❚❚</button>
    <button data-key="fwd" aria-label="Framåt 30 s">30↻</button>
  </div>
  <div id="now-bar"><i></i></div>
</div>

<main id="browse" class="tab on">
  <div class="search"><input id="q" type="search" placeholder="Sök film eller serie…" autocomplete="off"></div>
  <button id="btn-tonight" class="wide-btn">🎲  Vad ska jag se ikväll?</button>
  <div id="rows"></div>
  <p id="status" class="dim center"></p>
</main>

<main id="remote" class="tab">
  <form id="tv-search" class="tv-search"><input id="tv-q" type="search" placeholder="Sök på tv:n…" autocomplete="off" enterkeyhint="search"><button type="submit">Sök</button></form>
  <div class="pad">
    <button data-key="up" class="k up">▲</button>
    <button data-key="left" class="k left">◀</button>
    <button data-key="ok" class="k ok">OK</button>
    <button data-key="right" class="k right">▶</button>
    <button data-key="down" class="k down">▼</button>
  </div>
  <div class="row-btns">
    <button data-key="back">↩ Tillbaka</button>
    <button data-cmd="home">⌂ Start</button>
    <button data-cmd="tonight">🎲 Ikväll</button>
  </div>
  <h3>Under filmen</h3>
  <div class="row-btns">
    <button data-key="rew">↺ 10 s</button>
    <button data-key="toggle">❚❚ / ▶</button>
    <button data-key="fwd">30 s ↻</button>
  </div>
  <div class="row-btns">
    <button data-key="subs">Undertexter</button>
    <button data-key="subdelay" data-s="-0.25">Text ¼ s tidigare</button>
    <button data-key="subdelay" data-s="0.25">Text ¼ s senare</button>
  </div>
  <div class="row-btns">
    <button data-key="subsize" data-s="-1">A− Mindre text</button>
    <button data-key="subsize" data-s="1">A+ Större text</button>
  </div>
  <div class="row-btns">
    <button data-key="stop">■ Stoppa</button>
  </div>
  <h3>Appar på tv:n</h3>
  <div class="row-btns wrap">
    <button data-app="Stremio">Stremio</button>
    <button data-app="YouTube">YouTube</button>
    <button data-app="SVT Play">SVT Play</button>
    <button data-app="Tele2 Play">Tele2 Play</button>
    <button data-app="PS5">PS5</button>
  </div>
  <p class="dim small">Kommandona når tv:n när Lflix är öppen där. Slå på tv:n med LG ThinQ-appen.</p>
</main>

<div id="sheet" class="hidden">
  <div class="sheet-bg"></div>
  <div class="sheet-card">
    <div class="sheet-hero" id="s-hero"></div>
    <div class="sheet-body">
      <h2 id="s-title"></h2>
      <div id="s-meta" class="dim"></div>
      <p id="s-desc"></p>
      <div id="s-btns" class="sheet-btns"></div>
      <div id="s-seasons" class="chips"></div>
      <div id="s-eps"></div>
    </div>
    <button id="s-close" class="icon close" aria-label="Stäng">✕</button>
  </div>
</div>

<div id="settings" class="hidden">
  <div class="sheet-bg"></div>
  <div class="sheet-card small">
    <div class="sheet-body">
      <h2>Inställningar</h2>
      <div id="set-list"></div>
    </div>
    <button id="set-close" class="icon close" aria-label="Stäng">✕</button>
  </div>
</div>

<div id="bp" class="hidden">
  <video id="bp-video" controls playsinline autoplay></video>
  <div id="bp-bar">
    <span id="bp-title"></span>
    <span id="bp-subctl">
      <select id="bp-lang" aria-label="Undertextspråk"></select>
      <select id="bp-ver" aria-label="Version"></select>
      <button id="bp-sm" title="Mindre text">A−</button><button id="bp-lg" title="Större text">A+</button>
      <button id="bp-early" title="Texten kommer för sent">−¼ s</button><button id="bp-late" title="Texten kommer för tidigt">+¼ s</button>
      <button id="bp-auto" title="Synka mot en undertext som är gjord för filen">Synka</button>
    </span>
    <button id="bp-iina">Öppna i IINA</button>
    <button id="bp-close">✕ Stäng</button>
  </div>
  <div id="bp-msg" class="hidden"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="imdbdata.js"></script>
<script src="lists.js"></script>
<script src="streams.js"></script>
<script src="subs.js"></script>
<script>
  // Din IMDb-data ligger krypterad på GitHub. Lås upp den med nyckeln från din personliga länk,
  // och starta sedan appen (biblioteket läser IMDb-datan direkt när det laddas).
  (function () {
    function load(src, cb) { var e = document.createElement("script"); e.src = src; e.onload = cb; e.onerror = cb; document.body.appendChild(e); }
    function start() { load("library.js", function () { load("mobil.js"); }); }
    function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    var topic = ""; try { topic = localStorage.getItem("hem.remoteTopic") || ""; } catch (e) {}
    if (typeof IMDB_ENC === "undefined" || !topic || !window.crypto || !crypto.subtle) { start(); return; }
    crypto.subtle.digest("SHA-256", new TextEncoder().encode("hem-imdb:" + topic))
      .then(function (h) { return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["decrypt"]); })
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IMDB_ENC.iv) }, k, b64(IMDB_ENC.data)); })
      .then(function (buf) { IMDB_DATA = JSON.parse(new TextDecoder().decode(buf)); })
      .catch(function () {})
      .then(start);
  })();
</script>
</body>
</html>
